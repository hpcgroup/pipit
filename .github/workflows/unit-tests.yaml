name: unit tests

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v2
      # use over setup python since this allows us to use older
      # Pythons
      - uses: mamba-org/setup-micromamba@v2
        with:
          # the create command looks like this:
          # `micromamba create -n test-env python=(version)`
          environment-name: test-env
          create-args: python=${{ matrix.python-version }}

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install --upgrade numpy pandas pytest otf2

      - name: Lint and format check with flake8 and black
        if: ${{ matrix.python-version == 3.9 }}
        run: |
          pip install --upgrade black flake8
          black --diff --check .
          flake8

      - name: Update coverage
        if: ${{ matrix.python-version == 3.12 }}
        run: |
          pip install --upgrade coverage

      - name: Run coverage 
        if: ${{ matrix.python-version == 3.12 }}
        run: |
          PYTHONPATH=. coverage run $(which pytest)

      - name: Basic test with pytest
        run: |
          PYTHONPATH=. $(which pytest)

      - name: Upload coverage to Codecov
        if: ${{ matrix.python-version == 3.12 }}
        uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{ secrets.PIPIT_CODECOV_TOKEN }}
        with:
          directory: ./coverage/reports
          env_vars: OS,PYTHON
          files: /home/runner/work/pipit/pipit/coverage.xml
          flags: unittests
          verbose: true
          fail_ci_if_error: true

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python packages
        run: |
          pip install --upgrade pip
          pip install --upgrade numpy pandas pytest otf2

      - name: Basic test with pytest
        run: |
          PYTHONPATH=. $(which pytest)
 
